name: asset_mobile
description: ASSET — Gelişmiş Akıllı Algılama ve Söndürme Teknolojisi
publish_to: none
version: 2.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # BLE
  flutter_blue_plus: ^1.32.12


  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  smooth_page_indicator: ^1.1.0

  # Permissions
  permission_handler: ^11.3.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^21.0.0
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#1C1C1E"
  android_12:
    color: "#1C1C1E"

